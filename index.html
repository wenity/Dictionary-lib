<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>轻量化中英互查工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Prototype Demo</p>
          <h1>轻量化中英互查桌面工具</h1>
          <p class="subtitle">保留输入窗口和输出窗口，AI 配置放到设置页里，同时支持浏览器预览和 Tauri 桌面运行。</p>
        </div>
        <div class="hero-side">
          <div class="hero-meta">
            <span id="modeBadge" class="badge">浏览器预览</span>
            <span id="providerText" class="badge">本地大模型</span>
          </div>
          <button id="settingsBtn" type="button" class="secondary-btn">设置</button>
        </div>
      </header>

      <main class="layout">
        <section class="panel panel-left">
          <div class="panel-head">
            <div>
              <p class="section-label">输入窗口</p>
              <h2>输入一个英文单词或中文短语</h2>
            </div>
          </div>

          <form id="searchForm" class="search-form">
            <label class="input-wrap" for="queryInput">
              <span class="input-prefix">查词</span>
              <input
                id="queryInput"
                name="query"
                type="text"
                placeholder="例如：prototype / 迭代 / trade-off"
                autocomplete="off"
              />
            </label>

            <div class="action-row">
              <button type="submit" class="primary-btn">开始查询</button>
            </div>
          </form>
        </section>

        <section class="panel panel-right">
          <div class="panel-head">
            <div>
              <p class="section-label">输出窗口</p>
              <h2>翻译、解释和状态反馈</h2>
            </div>
          </div>

          <div id="resultState" class="result-state empty">
            <div class="empty-illustration">Aa</div>
            <h3>输入内容后按回车查询</h3>
            <p>结果会直接调用已配置的 AI 来源，以“主翻译 + 简短解释”的形式展示。</p>
          </div>

          <div id="resultView" class="result-view hidden">
            <div class="translation-card">
              <p class="muted">主翻译</p>
              <div id="translationText" class="translation-text"></div>
            </div>

            <div class="explain-card">
              <p class="muted">简短说明</p>
              <p id="explanationText" class="explanation-text"></p>
            </div>
          </div>

          <div id="loadingState" class="result-state loading hidden">
            <div class="spinner"></div>
            <h3>正在调用 AI</h3>
            <p>正在调用 AI 服务并解析返回内容，请稍候。</p>
          </div>

          <div id="errorState" class="result-state error hidden">
            <div class="error-icon">!</div>
            <h3 id="errorTitle">配置需要补全</h3>
            <p id="errorMessage"></p>
          </div>
        </section>
      </main>

      <section id="settingsPanel" class="settings-panel hidden" aria-hidden="true">
        <div class="settings-card">
          <div class="panel-head">
            <div>
              <p class="section-label">设置页</p>
              <h2>AI 配置</h2>
            </div>
            <button id="closeSettingsBtn" type="button" class="secondary-btn">关闭</button>
          </div>

          <div class="provider-tabs" role="tablist" aria-label="AI 来源切换">
            <button type="button" class="tab active" data-provider="local">本地大模型</button>
            <button type="button" class="tab" data-provider="api">第三方 API Key</button>
          </div>

          <div class="settings-grid">
            <label>
              <span>模型服务地址</span>
              <input id="serviceEndpoint" type="text" value="http://localhost:11434/v1" />
            </label>
            <label>
              <span>模型名称</span>
              <input id="modelName" type="text" value="qwen2.5:7b-instruct" />
            </label>
            <label class="full">
              <span>API Key</span>
              <input id="apiKey" type="password" placeholder="sk-..." />
            </label>
          </div>

          <div class="action-row">
            <button type="button" id="testBtn" class="primary-btn">测试连通性</button>
          </div>

          <p id="settingsHelperText" class="helper-text">当前模式会调用 OpenAI 兼容接口。快捷键为 Ctrl / ⌘ + K。</p>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
